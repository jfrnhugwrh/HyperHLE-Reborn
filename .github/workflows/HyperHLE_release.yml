name: Build UltraHLE Rebirth

on:
  workflow_dispatch:
    inputs:
      publish_ultrahle_release:
        description: Publish an UltraHLE Rebirth release (after all builds succeed)
        type: boolean
        default: false
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on trunk queue instead of cancelling each other: a cancelled run never
  # publishes its release, so frequent pushes could otherwise hold releases
  # back indefinitely. Queued runs start after the previous one finishes and
  # so see any tag it published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  build-android:
    runs-on: ubuntu-latest  

    steps:  
    - name: Checkout touchHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Cache Rust build artifacts
      uses: actions/cache@main
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor/boost  
        key: boost_1_81_0  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost  

    - name: Try to get cached copy of cmake  
      id: cache-cmake  
      uses: actions/cache@main
      with:  
        path: vendor/cmake  
        key: cmake_3_31_6_linux  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Download Cmake  
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Extract Cmake  
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake  

    - name: Install AArch64 Android Rust toolchain  
      run: rustup target add aarch64-linux-android  

    - name: Install cargo-ndk  
      run: cargo install cargo-ndk@3.5.4  

    - name: Try to get a cached copy of Gradle  
      id: cache-gradle  
      uses: actions/cache@main
      with:  
        path: gradle  
        key: gradle-8.11.1  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Download Gradle  
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Extract Gradle  
      run: 7z -ogradle x gradle-8.11.1-bin.zip  

    - name: Try to get a cached copy of Android NDK  
      id: cache-android-ndk  
      uses: actions/cache@main
      with:  
        path: android-ndk  
        key: android-ndk-r25c  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Download Android NDK  
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Extract Android NDK  
      run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip  

    - name: Link Android NDK  
      run: ln -s $PWD'/android-ndk/android-ndk-r25c' $ANDROID_SDK_ROOT'/ndk/25.2.9519653'  

    - name: Generate local.properties file  
      run: echo 'sdk.dir='$ANDROID_SDK_ROOT > android/local.properties  

    - name: Set up JDK 17  
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build for Android  
      run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/UltraHLE-Rebirth-release.apk ../UltraHLE-Rebirth.apk  
      env:  
        ULTRAHLE_KEYSTORE_B64: ${{ secrets.ULTRAHLE_KEYSTORE_B64 }}
        ULTRAHLE_KEYSTORE_PASSWORD: ${{ secrets.ULTRAHLE_KEYSTORE_PASSWORD }}
        ULTRAHLE_KEY_ALIAS: ${{ secrets.ULTRAHLE_KEY_ALIAS }}
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/25.2.9519653'  
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake  

    - name: Apply APK v3 key-rotation lineage (if configured)
      env:
        ULTRAHLE_KEY_LINEAGE_B64: ${{ secrets.ULTRAHLE_KEY_LINEAGE_B64 }}
        ULTRAHLE_KEYSTORE_B64: ${{ secrets.ULTRAHLE_KEYSTORE_B64 }}
        ULTRAHLE_KEYSTORE_PASSWORD: ${{ secrets.ULTRAHLE_KEYSTORE_PASSWORD }}
        ULTRAHLE_KEY_ALIAS: ${{ secrets.ULTRAHLE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        if [ -z "${ULTRAHLE_KEY_LINEAGE_B64:-}" ] || [ -z "${ULTRAHLE_KEYSTORE_B64:-}" ]; then
          exit 0
        fi
        APKSIGNER="$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)"
        KS_TMP="$(mktemp --suffix=.keystore)"
        LIN_TMP="$(mktemp --suffix=.lineage)"
        trap 'rm -f "$KS_TMP" "$LIN_TMP"' EXIT
        printf '%s' "$ULTRAHLE_KEYSTORE_B64" | base64 -d > "$KS_TMP"
        printf '%s' "$ULTRAHLE_KEY_LINEAGE_B64" | base64 -d > "$LIN_TMP"
        "$APKSIGNER" sign \
          --ks "$KS_TMP" \
          --ks-key-alias "${ULTRAHLE_KEY_ALIAS:-ultrahle}" \
          --ks-pass env:ULTRAHLE_KEYSTORE_PASSWORD \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --lineage "$LIN_TMP" \
          UltraHLE-Rebirth.apk

    - uses: actions/upload-artifact@main
      with:  
        name: UltraHLE_Android_AArch64  
        path: UltraHLE-Rebirth.apk

  check-hyperhle-release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/trunk') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog_from: ${{ steps.check.outputs.changelog_from }}
      changelog_limit: ${{ steps.check.outputs.changelog_limit }}
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether a HyperHLE release is due
        id: check
        env:
          FORCE_ULTRAHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ultrahle_release && 'true' || '' }}
        run: ./dev-scripts/hyperhle-should-release.sh

  # This fork only ships Android builds, so a release needs nothing but
  # the Android build.
  publish-hyperhle-release:
    needs: [check-hyperhle-release, build-android]
    if: >-
      needs.check-hyperhle-release.result == 'success' &&
      needs.check-hyperhle-release.outputs.should_release == 'true' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Download Android artifact
        uses: actions/download-artifact@main
        with:
          name: UltraHLE_Android_AArch64
          path: artifacts/android
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc zip
      - name: Package HyperHLE release files
        env:
          # Lets the changelog look up each commit author's GitHub username.
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FORCE_ULTRAHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ultrahle_release && 'true' || '' }}
          VERSION: ${{ needs.check-hyperhle-release.outputs.version }}
          CHANGELOG_FROM: ${{ needs.check-hyperhle-release.outputs.changelog_from }}
          CHANGELOG_LIMIT: ${{ needs.check-hyperhle-release.outputs.changelog_limit }}
        run: ./dev-scripts/package-hyperhle-release.sh "$VERSION" "$CHANGELOG_FROM"
      - name: Publish HyperHLE release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-hyperhle-release.outputs.version }}
          # Tag the commit that was built, not whatever trunk points at by now.
          target_commitish: ${{ github.sha }}
          name: UltraHLE Rebirth ${{ needs.check-hyperhle-release.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/UltraHLE-Rebirth_Android_AArch64.zip
          fail_on_unmatched_files: true
